services:
  panelcasero:
    build: .
    container_name: panelcasero
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - .env
    volumes:
      - ./config:/config:ro
      - ./data:/data        # base de datos, fotos y clips, claves de las notificaciones
    mem_limit: 256m

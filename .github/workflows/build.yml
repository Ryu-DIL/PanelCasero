name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write        # para publicar el .ipa en la release "latest"
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild \
            -project PanelCasero.xcodeproj \
            -scheme PanelCasero \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar el IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PanelCasero.app Payload/
          zip -r PanelCasero.ipa Payload

      - name: Subir el IPA
        uses: actions/upload-artifact@v4
        with:
          name: PanelCasero-ipa
          path: PanelCasero.ipa

      # El .ipa queda siempre en la misma dirección, para abrirlo directamente en el iPhone:
      # https://github.com/<usuario>/<repositorio>/releases/latest/download/PanelCasero.ipa
      - name: Publicar en la release "latest"
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PanelCasero.ipa \
            --title "Última versión" \
            --notes "Compilación automática del commit ${GITHUB_SHA::7}. Ábrela con TrollStore." \
            --target "$GITHUB_SHA"
